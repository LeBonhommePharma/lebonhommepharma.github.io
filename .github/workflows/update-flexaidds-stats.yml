name: Update FlexAIDdS stats

# Pull GitHub repo stats into the apex FlexAIDdS / flexaid-ds markers.
# FlexAIDdS cannot push here (GITHUB_TOKEN is repo-scoped; a full-tree rsync
# would also wipe rive/, entropy/, drug-of-the-day/, …). Same pattern as
# publish-transit.yml: this repo pulls, then dispatches pages.yml because a
# GITHUB_TOKEN push does not start other workflows.
#
# Fail closed: after deploy (and on schedule even when files did not change),
# curl live JSON + both HTML routes and compare to GitHub. A swallowed 403
# in FlexAIDdS update-site.yml is how thebonhomme.com/FlexAIDdS/ froze.

on:
  pull_request:
    paths:
      - "FlexAIDdS/index.html"
      - "flexaid-ds/index.html"
      - "assets/repo-stats.json"
      - "scripts/update_flexaidds_stats.py"
      - "scripts/test_update_flexaidds_stats.py"
      - "scripts/verify_live_flexaidds_stats.py"
      - ".github/workflows/update-flexaidds-stats.yml"
  schedule:
    - cron: "20 7 * * *"   # ~80 minutes after FlexAIDdS update-site.yml (06:00 UTC)
  workflow_dispatch:
  repository_dispatch:
    types: [flexaidds-stats]
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

# GITHUB_TOKEN only reads. The stats commit lands through a PR opened and
# merged with the bot App token (scripts/land-via-pr.sh); ruleset "main
# protection" rejects a direct push with GH013.
permissions:
  contents: read

concurrency:
  group: update-flexaidds-stats
  cancel-in-progress: false

jobs:
  update-stats:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apex site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Guard surgical patcher
        run: python3 scripts/test_update_flexaidds_stats.py

      - name: Refresh FlexAIDdS markers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_flexaidds_stats.py --tree .

      - name: Commit if stats changed
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          set -euo pipefail
          git add -- FlexAIDdS/index.html flexaid-ds/index.html assets/repo-stats.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh FlexAIDdS repo stats from GitHub"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Fail here, by name, rather than at a 403 later.
      - name: Bot landing token — preflight
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true'
        env:
          APP_ID: ${{ vars.BOT_APP_ID }}
          HAS_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ] || { echo "::error::repository variable BOT_APP_ID is not set — see DEPLOY.md, 'Bot landing token'"; exit 1; }
          [ "$HAS_KEY" = "true" ] || { echo "::error::repository secret BOT_APP_PRIVATE_KEY is not set — see DEPLOY.md, 'Bot landing token'"; exit 1; }

      - name: Bot landing token
        id: app
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # PR -> required checks green -> merge -> wait for the pages.yml run the
      # merge push starts (an App-token merge is an ordinary push).
      - name: Land on main via PR
        if: github.event_name != 'pull_request' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          scripts/land-via-pr.sh land flexaidds-stats "chore: refresh FlexAIDdS repo stats from GitHub"

      - name: Verify live GitHub stats (fail closed)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_live_flexaidds_stats.py --timeout 600 --interval 15
