name: Publish /transit

# Publishes the static Rive atlas from LeBonhommePharma/Transit into this
# repository's rive/ directory, then lets pages.yml deploy the site.
# /transit/ is an apex-authored 200 alias (not this rsync target). See DEPLOY.md.
#
# Why the engine lives here and not in the Transit repo: a workflow's
# GITHUB_TOKEN is scoped to its own repository, so Transit cannot push here.
# Transit is public, so this repo can read it with no credential at all.
# That makes the whole pipeline token-free. The GitHub repo is still named
# Transit; the public product is Rive.

on:
  # Also run when this publisher definition changes. This gives us a
  # credential-free immediate kick when an upstream publish is waiting on the
  # delayed GitHub schedule; normal Transit updates still use dispatch/schedule.
  #
  # main only. Without the branch filter, pushing a feature branch that edits
  # this file starts a NON-dry-run publish from that branch, whose sync step
  # pushes the branch's HEAD to main. Test changes here with a workflow_dispatch
  # on the branch with dry_run=true instead.
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-transit.yml
  # Instant publish. Transit's own workflow sends this once APEX_DISPATCH_TOKEN
  # exists; until then, use the schedule below or run this manually.
  repository_dispatch:
    types: [transit-publish]
  workflow_dispatch:
    inputs:
      ref:
        description: Transit ref to publish
        default: main
        type: string
      dry_run:
        description: Build and verify only — do not commit or push
        default: false
        type: boolean
      expect_sha256:
        description: "Failsafe drill: override the expected live sha256 to prove verification fails"
        default: ""
        type: string
  schedule:
    # Automatic publish without any secret. Cheap: exits early when in sync.
    - cron: "*/15 * * * *"

# GITHUB_TOKEN only reads. Writes to main go through a pull request opened and
# merged with the bot App token (scripts/land-via-pr.sh): ruleset "main
# protection" rejects direct pushes (GH013), and a PR opened with GITHUB_TOKEN
# never starts the required checks, so it could never merge.
permissions:
  contents: read

# Never let two publishes interleave. Not cancel-in-progress: a half-finished
# publish must be allowed to either complete or roll itself back.
concurrency:
  group: publish-transit
  cancel-in-progress: false

env:
  SITE_URL: https://thebonhomme.com/rive/
  TRANSIT_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apex site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Transit source
        uses: actions/checkout@v4
        with:
          repository: LeBonhommePharma/Transit
          ref: ${{ env.TRANSIT_REF }}
          path: _transit
          fetch-depth: 0

      - name: Resolve source commit
        id: src
        run: |
          set -euo pipefail
          cd _transit
          # Stamp with the last commit that touched the *published* surface,
          # not HEAD. The stamp goes into index.html, so using HEAD would make
          # every unrelated commit (a src/ change, a README edit) produce a
          # different artifact and churn a pointless republish. This keeps the
          # stamp a real, traceable commit while staying stable when the
          # published bytes have not changed.
          sha=$(git log -1 --format=%H -- \
                  public/Transit public/data public/l10n public/favicon.svg)
          [ -n "$sha" ] || sha=$(git rev-parse HEAD)
          echo "HEAD is $(git rev-parse HEAD); publishing content of $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:8}" >> "$GITHUB_OUTPUT"
          echo "Publishing Transit @ $sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _transit/package-lock.json

      - name: Install Transit dependencies
        working-directory: _transit
        run: npm ci

      # ---------------------------------------------------------------------
      # GATE A — the test suite.
      #
      # Scope note, deliberate and documented: this gate runs `npm test`, not
      # `npm run build`. `npm run build` (next build) is red on main with 10
      # pre-existing TypeScript errors — 9 in *.test.ts files and one in
      # src/lib/webgpu.ts. Those are NOT masked here and NOT fixed here; they
      # are simply not a gate on this deploy, because the Next.js app is not
      # what gets published. The published artifact is the hand-authored static
      # atlas under public/Transit plus the tracked GTFS data under public/data.
      # `npm test` is the meaningful gate: it is fully green (162/162) and it
      # imports the shipped static modules directly (see src/lib/rive.test.ts,
      # which imports ../../public/Transit/rive-kit.js and bikes.js), so it
      # exercises the exact bytes this workflow publishes.
      #
      # If you want next build gating the deploy, fix those 10 errors first and
      # add the step. Do not add it with `|| true`.
      # ---------------------------------------------------------------------
      # The suite size is reported, never hard-coded: it grows (162 → 268 →
      # 271), and a pinned number is a number that goes stale and starts
      # lying in the commit message. What IS enforced: a summary line must
      # exist, at least one test must have run, and every test must pass.
      # `node --test` with a glob that matches nothing exits 0 with "tests 0",
      # so exit status alone cannot catch an empty suite.
      - name: "Gate A — tests (count reported; zero or any failure is red)"
        id: tests
        working-directory: _transit
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/transit-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          # Capture the exit code explicitly (no `|| true`, no `set +e`) so the
          # counts below are always printed, and a non-zero exit still fails.
          if npm test 2>&1 | tee "$log"; then rc=0; else rc=$?; fi
          # TAP (node 22, non-TTY) prints "# tests N"; spec prints "ℹ tests N".
          count() { grep -E "^(# |ℹ )$1 [0-9]+$" "$log" | tail -1 | grep -oE '[0-9]+$' || true; }
          total=$(count tests); pass=$(count pass); fail=$(count fail)
          if [ -z "$total" ] || [ -z "$pass" ] || [ -z "$fail" ]; then
            echo "::error::Gate A: no test summary in the output — the runner did not finish or its format changed"; exit 1
          fi
          echo "Gate A: $pass/$total passed, $fail failed"
          echo "Gate A: $pass/$total tests passed" >> "$GITHUB_STEP_SUMMARY"
          [ "$total" -gt 0 ] || { echo "::error::Gate A: 0 tests ran — an empty suite is not a pass"; exit 1; }
          [ "$fail" -eq 0 ] && [ "$pass" -eq "$total" ] || { echo "::error::Gate A: $fail of $total tests failed"; exit 1; }
          [ "$rc" -eq 0 ] || { echo "::error::Gate A: npm test exited $rc although every counted test passed"; exit 1; }
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: "Gate B — compose and verify artifact"
        id: build
        run: |
          set -euo pipefail
          node _transit/scripts/publish-transit.mjs compose \
            --src _transit --out _stage --sha "${{ steps.src.outputs.sha }}"
          node _transit/scripts/publish-transit.mjs verify-artifact \
            --dir _stage --sha "${{ steps.src.outputs.sha }}" | tee _gate.txt
          sha256=$(grep '^index-sha256=' _gate.txt | cut -d= -f2)
          [ -n "$sha256" ] || { echo "::error::Gate B: verify-artifact printed no index-sha256"; exit 1; }
          files=$(find _stage -type f | wc -l | tr -d ' ')
          echo "Gate B: staged $files file(s), index.html sha256 $sha256"
          [ "$files" -gt 0 ] || { echo "::error::Gate B: compose staged 0 files — refusing to publish an empty /rive"; exit 1; }
          [ -f _stage/index.html ] || { echo "::error::Gate B: _stage/index.html missing"; exit 1; }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # rive/README.md is authored in this repo, not in Transit. Carry it
      # across so the sync below cannot drop it.
      - name: Preserve apex-local files
        run: |
          set -euo pipefail
          # `[ -f ] && cp || true` would also swallow a failed cp. Absent is
          # fine; present-but-uncopyable is an error and must say so here.
          if [ -f rive/README.md ]; then
            cp rive/README.md _stage/README.md
          fi

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if [ ! -d rive ]; then
            echo "rive/ does not exist yet — first publish."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # diff exits 0 = same, 1 = differs, 2 = trouble. Only 2 is an error.
          if diff -r -q rive _stage; then rc=0; else rc=$?; fi
          case "$rc" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT"
               echo "Already in sync at ${{ steps.src.outputs.short }} — nothing to publish." >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::diff rive _stage failed (exit $rc)"; exit 1 ;;
          esac

      # Fail here, by name, rather than at a 403 three steps later.
      - name: Bot landing token — preflight
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          APP_ID: ${{ vars.BOT_APP_ID }}
          HAS_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ] || { echo "::error::repository variable BOT_APP_ID is not set — see DEPLOY.md, 'Bot landing token'"; exit 1; }
          [ "$HAS_KEY" = "true" ] || { echo "::error::repository secret BOT_APP_PRIVATE_KEY is not set — see DEPLOY.md, 'Bot landing token'"; exit 1; }

      - name: Bot landing token
        id: app
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # --delete is scoped to the rive/ tree only. Nothing outside rive/
      # is read or written by this step, so /transit/ (the 200 alias),
      # transitA/, the other routes, pages.yml, CNAME, interaction.css,
      # fonts and PDFs are untouched by construction.
      - name: Sync into rive/
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          mkdir -p rive
          rsync -a --delete _stage/ rive/
          git config user.name  "transit-publish[bot]"
          git config user.email "transit-publish@users.noreply.github.com"
          git add -- rive
          git status --porcelain -- rive | head -20
          git commit -m "Publish /rive from Transit@${{ steps.src.outputs.short }}

          Source: LeBonhommePharma/Transit@${{ steps.src.outputs.sha }}
          index.html sha256: ${{ steps.build.outputs.sha256 }}
          Gates: tests ${{ steps.tests.outputs.total }}/${{ steps.tests.outputs.total }}, artifact integrity passed (${{ steps.build.outputs.files }} files)."

      # PR -> every required check green -> merge -> wait for the pages.yml
      # run that the merge push starts. The merge is made with the App token,
      # so it is an ordinary push and pages.yml deploys /rive through the same
      # job that serves every other route; no second dispatch is needed.
      - name: Land on main via PR
        id: land
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/land-via-pr.sh land transit "Publish /rive from Transit@${{ steps.src.outputs.short }}"

      # ---------------------------------------------------------------------
      # GATE C — the one whose absence caused the stale site.
      # A green run means "verified live", not "pushed".
      # ---------------------------------------------------------------------
      - name: "Gate C — verify live bytes"
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          expect="${{ github.event.inputs.expect_sha256 }}"
          [ -n "$expect" ] || expect="${{ steps.build.outputs.sha256 }}"
          [ -n "${{ github.event.inputs.expect_sha256 }}" ] && \
            echo "::warning::FAILSAFE DRILL — expecting deliberately wrong sha256 $expect"
          node _transit/scripts/publish-transit.mjs verify-live \
            --url "$SITE_URL" \
            --sha "${{ steps.src.outputs.sha }}" \
            --sha256 "$expect" \
            --timeout 900 --interval 15

      - name: "Gate D — other routes still serve"
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          fail=0
          for r in / /rive/ /transit/ /benchmark/ /shannon/ /periodic/ /FlexAIDdS/ /drug-of-the-day/ /interaction.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://thebonhomme.com$r")
            printf '%-22s %s\n' "$r" "$code"
            [ "$code" = "200" ] || fail=1
          done
          alias=$(curl -s "https://thebonhomme.com/transit/")
          printf '%s' "$alias" | grep -q '/rive/' || {
            echo "::error::/transit/ 200 but does not point at /rive/"; fail=1
          }
          [ "$fail" = "0" ] || { echo "::error::a non-rive route regressed, or the /transit alias broke"; exit 1; }

      # If the bytes never went live, put the site back the way we found it
      # rather than leaving an unverified publish standing.
      # Only once this run's PR actually merged: before that, main never
      # changed and there is nothing to roll back (the open PR is left for
      # inspection and closed as superseded by the next run).
      - name: Roll back on verification failure
        if: failure() && steps.land.outputs.merge_sha != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MERGE_SHA: ${{ steps.land.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git config user.name  "transit-publish[bot]"
          git config user.email "transit-publish@users.noreply.github.com"
          git fetch origin main
          git checkout --detach origin/main
          git revert -m 1 --no-edit "$MERGE_SHA" || {
            echo "::error::automatic rollback of $MERGE_SHA failed — roll back by hand, see DEPLOY.md"; exit 1; }
          scripts/land-via-pr.sh land rollback-transit "Roll back /rive publish $MERGE_SHA (live verification failed)"
          echo "::warning::Verification failed; /rive publish $MERGE_SHA rolled back through a PR"

      - name: Summary
        if: always()
        run: |
          {
            echo "| field | value |"
            echo "|---|---|"
            echo "| Transit ref | \`${{ env.TRANSIT_REF }}\` |"
            echo "| Transit sha | \`${{ steps.src.outputs.sha }}\` |"
            echo "| index.html sha256 | \`${{ steps.build.outputs.sha256 }}\` |"
            echo "| changed | ${{ steps.diff.outputs.changed }} |"
            echo "| dry run | ${{ github.event.inputs.dry_run || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
