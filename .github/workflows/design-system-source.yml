name: Design system · source of truth

# Complements palette-check.yml rather than replacing it.
#
# palette-check.yml is a DENYLIST: it names the retired v1 hues and rejects
# them. It stays, and it is good at what it does. It cannot catch a colour
# nobody has thought of yet — a Cursor agent shipped `--hp-gold: #C4A359` into
# index.html and that guard passed, correctly, because #C4A359 is not one of
# the eight colours it knows to forbid. It was the wrong question.
#
# This workflow asks the other question: is every colour literal in the tree
# one the design system actually defines? And are the contrast ratios the
# system claims still true, and do the generated per-target artifacts still
# match the source they were generated from?
#
# Separate workflow for the same reason linkcheck.yml and palette-check.yml are
# separate: pages.yml is the transit bot's publish path and publish-transit.yml
# is the bot itself. Neither should grow a job that can wedge an automated push.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-system:
    name: Design system · tokens are the one source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Proves the patterns can still fail. If this is red, the scan below
      # tells you nothing and must not be trusted. Same doctrine as
      # palette-check.yml: a check that cannot fail is not a check.
      # Every check below is independent, so each runs even if an earlier one
      # is red. Without `if: always()` the first failure skips the rest, and a
      # skipped check is an unknown wearing the colour of a decision — the first
      # run of this workflow proved the raw-hex guard worked and said nothing at
      # all about contrast, the colorsets, or artifact drift.
      #
      # The self-tests are deliberately NOT guarded that way: each gates its own
      # scan. If the patterns have stopped matching their fixtures, the scan
      # that follows tells you nothing and must not be trusted.
      - name: Self-test the raw-hex guard
        run: node design-system/check-raw-hex.mjs --self-test

      # Every colour literal must be one tokens.css defines, or be
      # grandfathered in design-system/raw-hex-baseline.json.
      - name: No colour born outside the token source
        run: node design-system/check-raw-hex.mjs

      # Every ratio annotated in tokens.css must be true, and every foreground
      # token must clear AA against the ground it is used on, in both themes.
      - name: Contrast ratios are measured, not asserted
        if: always()
        run: node design-system/check-contrast.mjs

      # Every brand colorset must have a dark-appearance twin, each pair must be
      # a relighting of the other under the same OKLCH allowance
      # scripts/check-design-system.sh enforces, and both halves must clear AA
      # against the ground they are actually shown on. A twin that looks right
      # and fails contrast is worse than none, because it ships silently.
      - name: Self-test the colorset guard
        if: always()
        run: node design-system/check-colorsets.mjs --self-test

      - name: Every colorset has a verified dark twin
        if: always()
        run: node design-system/check-colorsets.mjs

      # The colour maths lived in four copies and the duplication cost this
      # repo twice — once when a copy dropped the /255 normalisation, once when
      # a copy carried a rounded comparison that let two colorsets ship below
      # AA reported as passing. Three copies are now one imported module. The
      # fourth is the Python port inside scripts/check-design-system.sh, which
      # cannot import a JS module and keeps its own fail-closed behaviour when
      # python3 is absent. This pins the port to oklch.mjs so it cannot drift.
      - name: The shell guard's maths agrees with oklch.mjs
        if: always()
        run: node design-system/check-maths-parity.mjs --verbose

      # The seven --*-fg light values are SOLVED, and used to be transcribed
      # into tokens.css by hand from a script that only printed to stdout. A
      # typo, a partial paste, a paste into the wrong block, or a paste that
      # never happened would all have shipped silently -- nothing anywhere
      # compared the published values against what the solver produces.
      - name: Prove the solver guard catches a desynchronised value
        if: always()
        run: node design-system/derive-light.mjs --self-test

      - name: The light --*-fg values are what the solver produces
        if: always()
        run: node design-system/derive-light.mjs --check

      # The generated targets must match the source they came from. This is
      # what makes "one source of truth" a fact rather than an intention.
      - name: Generated artifacts match tokens.css
        if: always()
        run: node design-system/emit.mjs --check
