<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rive. Horaires RTC et STM, sans abonnement</title>
    <meta
      name="description"
      content="Lis l'horaire d'un arrêt à Québec ou Montréal même si tu n'y es pas. Gratuit. Apache 2.0."
    />
    <link rel="icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rive" />
    <meta name="theme-color" content="#f5f5f7" />
    <style>
      :root {
        --ink: #1d1d1f;
        --paper: #f5f5f7;
        --muted: #6e6e73;
        --sodium: #0071e3;
        --glass: rgb(255 255 255 / 0.86);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #ui { position: relative; z-index: 2; pointer-events: none; min-height: 100dvh; }
      #ui > * { pointer-events: auto; }
      .cities { display: flex; width: max-content; margin: 16px auto 0; padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid rgb(0 0 0 / 0.08); }
      .cities button { border: 0; background: transparent; color: #6e6e73; padding: 8px 18px; border-radius: 999px; font: inherit; cursor: pointer; }
      .cities button.on { background: #1d1d1f; color: #fff; }
      .sheet { position: absolute; left: 16px; top: 68px; width: min(400px, calc(100% - 32px)); background: var(--glass); border: 1px solid rgb(0 0 0 / 0.08); border-radius: 28px; padding: 16px; backdrop-filter: blur(18px); }
      .sheet h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
      .sheet p.lead { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.4; }
      .sheet input { width: 100%; border: 0; border-radius: 16px; background: rgb(0 0 0 / 0.06); color: var(--ink); padding: 12px 14px; font: inherit; outline: none; }
      .hits { list-style: none; margin: 10px 0 0; padding: 0; }
      .hits button { width: 100%; text-align: left; border: 0; background: transparent; color: inherit; padding: 8px 2px; font: inherit; cursor: pointer; }
      .board { margin-top: 14px; }
      .board h2 { margin: 0 0 4px; font-size: 20px; font-weight: 560; }
      .row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
      .badge { min-width: 44px; text-align: center; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 700; }
      .times { font-family: ui-monospace, monospace; font-size: 12px; color: #6e6e73; letter-spacing: 0.04em; }
      footer { position: absolute; right: 16px; bottom: 14px; max-width: 280px; text-align: right; font-size: 10px; color: #6e6e73; line-height: 1.45; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="ui">
      <div class="cities" role="tablist">
        <button type="button" id="btn-quebec" class="on">Québec</button>
        <button type="button" id="btn-montreal">Montréal</button>
      </div>
      <section class="sheet">
        <h1>Horaire ailleurs</h1>
        <p class="lead">
          Tape un arrêt où tu n{"'"}es pas. Les passages viennent du GTFS officiel. Gratuit.
        </p>
        <label>
          <span class="sr-only" style="position:absolute;left:-9999px">Arrêt</span>
          <input id="q" type="search" autocomplete="off" placeholder="Youville, 801, Berri, McGill…" />
        </label>
        <ul class="hits" id="hits"></ul>
        <div class="board" id="board" hidden></div>
      </section>
      <footer>
        <span id="gpu">WebGL</span><br />
        Rive, Apache License 2.0.
        <a href="./LICENSE.txt">LICENSE</a> ·
        <a id="watch-link" href="./watch.html">Watch</a> ·
        <span id="attr"></span>
      </footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
