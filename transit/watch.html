<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rive Watch</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1d1d1f" />
    <style>
      html, body { height: 100%; margin: 0; background: #1d1d1f; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
      .route { font-size: 22px; font-weight: 700; }
      .remain { font-size: 56px; font-weight: 620; letter-spacing: -0.04em; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; }
      .clocks { font-family: ui-monospace, monospace; font-size: 16px; letter-spacing: 0.06em; margin-top: 8px; }
      .stop { margin-top: 10px; font-size: 14px; opacity: 0.7; max-width: 16rem; }
      .hint { margin-top: 28px; font-size: 11px; opacity: 0.45; max-width: 18rem; line-height: 1.4; }
    </style>
  </head>
  <body>
    <main id="face">
      <div class="route" id="route">Rive</div>
      <div class="remain" id="remain">—</div>
      <div class="clocks" id="clocks">—</div>
      <div class="stop" id="stop">Ouvre un arrêt sur l'atlas.</div>
      <p class="hint">
        Ajoute cette page à l'écran d'accueil Watch ou ouvre le lien Handoff.
        L'horaire est dans l'URL. Le téléphone peut être éteint.
      </p>
    </main>
    <script type="module">
      import { remainMinutes, watchPulseFromPayload } from "./rive-kit.js";

      function minutesNow() {
        const parts = new Intl.DateTimeFormat("en-GB", {
          timeZone: "America/Montreal",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23",
        }).formatToParts(new Date());
        return (
          Number(parts.find((p) => p.type === "hour").value) * 60 +
          Number(parts.find((p) => p.type === "minute").value)
        );
      }

      function readLive() {
        try {
          const q = new URLSearchParams(location.search);
          if (q.get("s") || q.get("r") || q.get("m")) {
            return watchPulseFromPayload({
              s: q.get("s") || "",
              r: q.get("r") || "",
              k: q.get("k") || "",
              t: q.get("t") || "",
              m: q.get("m") || "",
            });
          }
          return watchPulseFromPayload(localStorage.getItem("rive.live"));
        } catch {
          return null;
        }
      }

      function paint() {
        try {
          const live = readLive();
          if (!live) return;
          document.getElementById("route").textContent = live.route || "Rive";
          document.getElementById("route").style.color = live.color || "#fff";
          const wait = remainMinutes(live.departs || [], minutesNow());
          document.getElementById("remain").textContent =
            wait == null ? "—" : wait === 0 ? "now" : String(wait);
          document.getElementById("clocks").textContent =
            (live.clocks || []).slice(0, 4).join("  ") || "—";
          document.getElementById("stop").textContent = live.stop || "";
        } catch {
          /* stay on the empty face */
        }
      }
      paint();
      setInterval(paint, 15000);
    </script>
  </body>
</html>
