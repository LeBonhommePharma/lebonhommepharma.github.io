document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9a47fb2f-afa6-4cb2-90b7-50b33b2fadd6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n\n  :root {\n    --teal: #20808D;\n    --terra: #A84B2F;\n    --gold: #D4A843;\n    --deep: #0a0e14;\n    --panel: rgba(10, 14, 20, 0.85);\n    --glow-teal: rgba(32, 128, 141, 0.4);\n    --glow-terra: rgba(168, 75, 47, 0.4);\n    --glow-gold: rgba(212, 168, 67, 0.4);\n  }\n\n  body {\n    background: var(--deep);\n    color: #e0e0e0;\n    font-family: 'Space Grotesk', sans-serif;\n    overflow: hidden;\n    height: 100vh;\n    width: 100vw;\n  }\n\n  #canvas3d {\n    position: fixed;\n    top: 0; left: 0;\n    width: 100%; height: 100%;\n    z-index: 1;\n  }\n\n  /* HUD overlay */\n  #hud {\n    position: fixed;\n    top: 0; left: 0;\n    width: 100%; height: 100%;\n    z-index: 10;\n    pointer-events: none;\n  }\n\n  #hud > * { pointer-events: auto; }\n\n  /* Top bar — track info + BPM */\n  .top-bar {\n    position: absolute;\n    top: 16px; left: 50%;\n    transform: translateX(-50%);\n    display: flex;\n    align-items: center;\n    gap: 24px;\n    background: var(--panel);\n    backdrop-filter: blur(20px);\n    border: 1px solid rgba(32, 128, 141, 0.3);\n    border-radius: 12px;\n    padding: 12px 28px;\n    font-family: 'JetBrains Mono', monospace;\n    min-width: 500px;\n    justify-content: center;\n  }\n\n  .track-info {\n    display: flex;\n    flex-direction: column;\n    gap: 2px;\n    max-width: 280px;\n  }\n\n  .track-name {\n    font-size: 13px;\n    font-weight: 600;\n    color: var(--gold);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n  }\n\n  .track-artist {\n    font-size: 11px;\n    color: rgba(224, 224, 224, 0.5);\n  }\n\n  .bpm-display {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 0;\n  }\n\n  .bpm-value {\n    font-size: 36px;\n    font-weight: 700;\n    color: var(--teal);\n    line-height: 1;\n    transition: color 0.3s;\n  }\n\n  .bpm-label {\n    font-size: 9px;\n    letter-spacing: 3px;\n    text-transform: uppercase;\n    color: rgba(224, 224, 224, 0.4);\n  }\n\n  .delta-tempo {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n  }\n\n  .delta-value {\n    font-size: 22px;\n    font-weight: 600;\n    line-height: 1;\n    transition: color 0.3s;\n  }\n\n  .delta-label {\n    font-size: 8px;\n    letter-spacing: 2px;\n    text-transform: uppercase;\n    color: rgba(224, 224, 224, 0.4);\n    margin-top: 2px;\n  }\n\n  /* Left panel — thermodynamic state */\n  .thermo-panel {\n    position: absolute;\n    left: 16px;\n    top: 50%;\n    transform: translateY(-50%);\n    background: var(--panel);\n    backdrop-filter: blur(20px);\n    border: 1px solid rgba(32, 128, 141, 0.2);\n    border-radius: 12px;\n    padding: 20px 16px;\n    font-family: 'JetBrains Mono', monospace;\n    width: 220px;\n  }\n\n  .thermo-panel h3 {\n    font-size: 10px;\n    letter-spacing: 3px;\n    text-transform: uppercase;\n    color: var(--teal);\n    margin-bottom: 14px;\n    font-family: 'Space Grotesk', sans-serif;\n  }\n\n  .metric-row {\n    display: flex;\n    justify-content: space-between;\n    align-items: baseline;\n    margin-bottom: 10px;\n    font-size: 11px;\n  }\n\n  .metric-label {\n    color: rgba(224, 224, 224, 0.5);\n  }\n\n  .metric-val {\n    font-weight: 600;\n    font-size: 13px;\n  }\n\n  .metric-val.teal { color: var(--teal); }\n  .metric-val.terra { color: var(--terra); }\n  .metric-val.gold { color: var(--gold); }\n\n  .sigma-bar {\n    width: 100%;\n    height: 6px;\n    background: rgba(255,255,255,0.05);\n    border-radius: 3px;\n    margin-top: 4px;\n    overflow: hidden;\n  }\n\n  .sigma-fill {\n    height: 100%;\n    border-radius: 3px;\n    transition: width 0.5s ease, background 0.5s ease;\n  }\n\n  /* Right panel — Shannon metrics */\n  .shannon-panel {\n    position: absolute;\n    right: 16px;\n    top: 50%;\n    transform: translateY(-50%);\n    background: var(--panel);\n    backdrop-filter: blur(20px);\n    border: 1px solid rgba(168, 75, 47, 0.2);\n    border-radius: 12px;\n    padding: 20px 16px;\n    font-family: 'JetBrains Mono', monospace;\n    width: 220px;\n  }\n\n  .shannon-panel h3 {\n    font-size: 10px;\n    letter-spacing: 3px;\n    text-transform: uppercase;\n    color: var(--terra);\n    margin-bottom: 14px;\n    font-family: 'Space Grotesk', sans-serif;\n  }\n\n  /* Bottom — waveform + controls */\n  .bottom-bar {\n    position: absolute;\n    bottom: 16px;\n    left: 50%;\n    transform: translateX(-50%);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 10px;\n  }\n\n  #waveform {\n    width: 600px;\n    height: 60px;\n    border-radius: 8px;\n    background: rgba(10, 14, 20, 0.6);\n    border: 1px solid rgba(32, 128, 141, 0.15);\n  }\n\n  .controls {\n    display: flex;\n    gap: 12px;\n    align-items: center;\n  }\n\n  .ctrl-btn {\n    background: rgba(32, 128, 141, 0.15);\n    border: 1px solid rgba(32, 128, 141, 0.3);\n    color: var(--teal);\n    padding: 8px 18px;\n    border-radius: 8px;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 11px;\n    cursor: pointer;\n    transition: all 0.2s;\n    letter-spacing: 1px;\n  }\n\n  .ctrl-btn:hover {\n    background: rgba(32, 128, 141, 0.3);\n    border-color: var(--teal);\n  }\n\n  .ctrl-btn.active {\n    background: var(--teal);\n    color: var(--deep);\n    font-weight: 600;\n  }\n\n  .ctrl-btn.terra {\n    background: rgba(168, 75, 47, 0.15);\n    border-color: rgba(168, 75, 47, 0.3);\n    color: var(--terra);\n  }\n\n  .ctrl-btn.terra:hover {\n    background: rgba(168, 75, 47, 0.3);\n    border-color: var(--terra);\n  }\n\n  .ctrl-btn.terra.active {\n    background: var(--terra);\n    color: var(--deep);\n  }\n\n  /* State indicator */\n  .state-badge {\n    position: absolute;\n    top: 90px;\n    left: 50%;\n    transform: translateX(-50%);\n    font-family: 'Space Grotesk', sans-serif;\n    font-size: 14px;\n    font-weight: 600;\n    letter-spacing: 4px;\n    text-transform: uppercase;\n    padding: 6px 24px;\n    border-radius: 20px;\n    transition: all 0.5s;\n  }\n\n  /* Crooks cycle indicator */\n  .cycle-indicator {\n    position: absolute;\n    bottom: 110px;\n    left: 50%;\n    transform: translateX(-50%);\n    display: flex;\n    gap: 4px;\n    align-items: center;\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px;\n    color: rgba(224, 224, 224, 0.4);\n    letter-spacing: 2px;\n  }\n\n  .cycle-dot {\n    width: 8px;\n    height: 8px;\n    border-radius: 50%;\n    transition: all 0.3s;\n  }\n\n  /* Instructions overlay */\n  #instructions {\n    position: fixed;\n    top: 0; left: 0;\n    width: 100%; height: 100%;\n    background: rgba(10, 14, 20, 0.95);\n    z-index: 100;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-direction: column;\n    gap: 30px;\n    cursor: pointer;\n  }\n\n  #instructions h1 {\n    font-family: 'Space Grotesk', sans-serif;\n    font-size: 42px;\n    font-weight: 700;\n    background: linear-gradient(135deg, var(--teal), var(--gold));\n    -webkit-background-clip: text;\n    -webkit-text-fill-color: transparent;\n    letter-spacing: -1px;\n  }\n\n  #instructions h2 {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 13px;\n    font-weight: 300;\n    color: rgba(224, 224, 224, 0.5);\n    letter-spacing: 4px;\n    text-transform: uppercase;\n  }\n\n  .instruction-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 20px 40px;\n    max-width: 700px;\n    margin-top: 20px;\n  }\n\n  .instr-item {\n    display: flex;\n    gap: 12px;\n    align-items: flex-start;\n  }\n\n  .instr-icon {\n    font-size: 20px;\n    min-width: 30px;\n    text-align: center;\n  }\n\n  .instr-text {\n    font-size: 13px;\n    line-height: 1.5;\n    color: rgba(224, 224, 224, 0.7);\n  }\n\n  .instr-text strong {\n    color: var(--teal);\n    font-weight: 600;\n  }\n\n  .instr-text em {\n    color: var(--gold);\n    font-style: normal;\n  }\n\n  #instructions .start-hint {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 11px;\n    color: rgba(224, 224, 224, 0.3);\n    letter-spacing: 2px;\n    margin-top: 20px;\n    animation: pulse 2s ease-in-out infinite;\n  }\n\n  @keyframes pulse {\n    0%, 100% { opacity: 0.3; }\n    50% { opacity: 0.7; }\n  }\n\n  .le-bonhomme {\n    font-size: 10px;\n    font-family: 'JetBrains Mono', monospace;\n    color: rgba(224, 224, 224, 0.15);\n    letter-spacing: 3px;\n    text-transform: uppercase;\n    position: absolute;\n    bottom: 20px;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<canvas id=\"canvas3d\"><\u002Fcanvas>\n\n<!-- Instructions Overlay -->\n<div id=\"instructions\">\n  <h2>Le Bonhomme Pharma presents<\u002Fh2>\n  <h1>ENTROPY DOCKING<\u002Fh1>\n  <h2>Shannon × Music × Molecular × You<\u002Fh2>\n\n  <div class=\"instruction-grid\">\n    <div class=\"instr-item\">\n      <div class=\"instr-icon\">🎵<\u002Fdiv>\n      <div class=\"instr-text\"><strong>BPM = Temperature<\u002Fstrong><br>Music tempo drives the simulation temperature. Faster = hotter = more exploration.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"instr-item\">\n      <div class=\"instr-icon\">📉<\u002Fdiv>\n      <div class=\"instr-text\"><strong>∆tempo = dI/dT<\u002Fstrong><br>Tempo changes trigger <em>Shannon Energy Collapse<\u002Fem>. Beat drops = binding events.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"instr-item\">\n      <div class=\"instr-icon\">🔄<\u002Fdiv>\n      <div class=\"instr-text\"><strong>Crooks Round-Trip<\u002Fstrong><br>Forward cycle (heat → unbind) and reverse (cool → bind). σ_irr → 0 = perfect closure.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"instr-item\">\n      <div class=\"instr-icon\">💊<\u002Fdiv>\n      <div class=\"instr-text\"><strong>Dock the Drug<\u002Fstrong><br>Guide the ligand into the pocket by controlling tempo. Lower entropy = tighter binding.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"instr-item\">\n      <div class=\"instr-icon\">❤️<\u002Fdiv>\n      <div class=\"instr-text\"><strong>HRV Coupling<\u002Fstrong><br>Your heartbeat modulates physiological coupling. Music entrains biology.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"instr-item\">\n      <div class=\"instr-icon\">🎯<\u002Fdiv>\n      <div class=\"instr-text\"><strong>Goal: σ_irr → 0<\u002Fstrong><br>Achieve thermodynamic closure across all scales simultaneously. No information lost.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"start-hint\">CLICK ANYWHERE TO BEGIN — PLAY MUSIC IN APPLE MUSIC<\u002Fdiv>\n  <div class=\"le-bonhomme\">Le Bonhomme Pharma — Make Crack Great Again<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- HUD -->\n<div id=\"hud\" style=\"display:none;\">\n\n  <!-- Top: Track + BPM -->\n  <div class=\"top-bar\">\n    <div class=\"track-info\">\n      <div class=\"track-name\" id=\"trackName\">No track detected<\u002Fdiv>\n      <div class=\"track-artist\" id=\"trackArtist\">Play music in Apple Music<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"bpm-display\">\n      <div class=\"bpm-value\" id=\"bpmValue\">---<\u002Fdiv>\n      <div class=\"bpm-label\">BPM ≡ k<sub>B<\u002Fsub>T<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"delta-tempo\">\n      <div class=\"delta-value\" id=\"deltaValue\" style=\"color: rgba(224,224,224,0.3);\">±0.0<\u002Fdiv>\n      <div class=\"delta-label\">∆BPM/∆t ≡ dI/dT<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- State badge -->\n  <div class=\"state-badge\" id=\"stateBadge\" style=\"background: rgba(32,128,141,0.15); border: 1px solid rgba(32,128,141,0.3); color: var(--teal);\">\n    EXPLORING\n  <\u002Fdiv>\n\n  <!-- Left: Thermodynamic State -->\n  <div class=\"thermo-panel\">\n    <h3>Thermodynamic State<\u002Fh3>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">T (BPM→K)<\u002Fspan>\n      <span class=\"metric-val teal\" id=\"tempK\">300.0 K<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">ΔG_bind<\u002Fspan>\n      <span class=\"metric-val teal\" id=\"deltaG\">-8.2 kcal/mol<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">ΔH<\u002Fspan>\n      <span class=\"metric-val gold\" id=\"deltaH\">-12.4 kcal/mol<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">-TΔS<\u002Fspan>\n      <span class=\"metric-val terra\" id=\"minusTdS\">+4.2 kcal/mol<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">K_D<\u002Fspan>\n      <span class=\"metric-val teal\" id=\"kdVal\">0.9 nM<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">σ_irr<\u002Fspan>\n      <span class=\"metric-val terra\" id=\"sigmaIrr\">0.142 k_B<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"sigma-bar\">\n      <div class=\"sigma-fill\" id=\"sigmaFill\" style=\"width:14.2%; background: var(--terra);\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-row\" style=\"margin-top:10px;\">\n      <span class=\"metric-label\">Landauer bits<\u002Fspan>\n      <span class=\"metric-val gold\" id=\"landauerBits\">0.205<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Right: Shannon Metrics -->\n  <div class=\"shannon-panel\">\n    <h3>Shannon Metrics<\u002Fh3>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">S_audio<\u002Fspan>\n      <span class=\"metric-val terra\" id=\"sAudio\">3.21 bits<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">S_config<\u002Fspan>\n      <span class=\"metric-val teal\" id=\"sConfig\">4.87 bits<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">I(music;mol)<\u002Fspan>\n      <span class=\"metric-val gold\" id=\"mutualInfo\">1.42 bits<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">dI/dT<\u002Fspan>\n      <span class=\"metric-val terra\" id=\"diDt\">-0.023 bits/K<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">SCI<\u002Fspan>\n      <span class=\"metric-val gold\" id=\"sciVal\">0.44<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"sigma-bar\">\n      <div class=\"sigma-fill\" id=\"sciFill\" style=\"width:44%; background: var(--gold);\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"metric-row\" style=\"margin-top:10px;\">\n      <span class=\"metric-label\">Binding %<\u002Fspan>\n      <span class=\"metric-val teal\" id=\"bindPct\">62%<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"metric-row\">\n      <span class=\"metric-label\">Crooks cycle<\u002Fspan>\n      <span class=\"metric-val\" id=\"crooksCycle\" style=\"color: rgba(224,224,224,0.5);\">FWD →<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Bottom: Waveform + Controls -->\n  <div class=\"bottom-bar\">\n    <canvas id=\"waveform\" width=\"600\" height=\"60\"><\u002Fcanvas>\n    <div class=\"controls\">\n      <button class=\"ctrl-btn active\" id=\"btnAuto\">AUTO BPM<\u002Fbutton>\n      <button class=\"ctrl-btn\" id=\"btnManual\">MANUAL<\u002Fbutton>\n      <input type=\"range\" min=\"40\" max=\"200\" value=\"120\" id=\"bpmSlider\" style=\"width:160px; accent-color: var(--teal); display:none;\">\n      <button class=\"ctrl-btn terra\" id=\"btnCrooks\">CROOKS FLIP<\u002Fbutton>\n      <button class=\"ctrl-btn\" id=\"btnReset\">RESET σ<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Crooks cycle indicator -->\n  <div class=\"cycle-indicator\">\n    <span>FWD<\u002Fspan>\n    <div class=\"cycle-dot\" id=\"dot1\" style=\"background: var(--teal);\"><\u002Fdiv>\n    <div class=\"cycle-dot\" id=\"dot2\" style=\"background: rgba(224,224,224,0.1);\"><\u002Fdiv>\n    <div class=\"cycle-dot\" id=\"dot3\" style=\"background: rgba(224,224,224,0.1);\"><\u002Fdiv>\n    <div class=\"cycle-dot\" id=\"dot4\" style=\"background: rgba(224,224,224,0.1);\"><\u002Fdiv>\n    <div class=\"cycle-dot\" id=\"dot5\" style=\"background: rgba(224,224,224,0.1);\"><\u002Fdiv>\n    <div class=\"cycle-dot\" id=\"dot6\" style=\"background: rgba(224,224,224,0.1);\"><\u002Fdiv>\n    <span>REV<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"bebd557d-a9df-4c24-ab9c-3a3f7cbe5a31\"><\u002Fscript>\n<script>\n// ============================================================================\n// ENTROPY DOCKING — Le Bonhomme Pharma\n// Shannon × Music × Molecular × AR/VR\n// ============================================================================\n\n// --- STATE ---\nconst STATE = {\n  bpm: 120,\n  prevBpm: 120,\n  deltaBpm: 0,\n  temperature: 300, // K — mapped from BPM\n  deltaG: -8.2,\n  deltaH: -12.4,\n  minusTdS: 4.2,\n  kd: 0.9e-9,\n  sigmaIrr: 0.142,\n  landauerBits: 0.205,\n  sAudio: 3.21,\n  sConfig: 4.87,\n  mutualInfo: 1.42,\n  diDt: -0.023,\n  sci: 0.44,\n  bindingPct: 0.62,\n  crooksDirection: 1, // 1 = forward, -1 = reverse\n  crooksPhase: 0, // 0-1 cycle progress\n  isManual: false,\n  audioAnalyser: null,\n  audioData: null,\n  time: 0,\n  ligandDocked: false,\n  ligandProgress: 0.5, // 0 = free, 1 = docked\n  particleEntropy: 1.0,\n  totalWorkFwd: 0,\n  totalWorkRev: 0,\n};\n\n// --- BPM → Temperature mapping ---\n// 60 BPM → 250K (cold), 120 BPM → 310K (physiological), 180 BPM → 400K (hot)\nfunction bpmToTemp(bpm) {\n  return 250 + (bpm - 60) * (150 / 120);\n}\n\n// Temperature → thermodynamic quantities\nfunction updateThermo() {\n  const T = STATE.temperature;\n  const R = 1.987e-3; // kcal/(mol·K)\n  const beta = 1 / (R * T);\n\n  // Van't Hoff: ΔG = ΔH - TΔS\n  // Reference: ΔH = -12.4, ΔS = -14.1 cal/(mol·K) at 300K\n  const dH = -12.4;\n  const dS = -0.0141; // kcal/(mol·K)\n  const dCp = -0.15; // kcal/(mol·K) — heat capacity correction\n\n  // Nonlinear Van't Hoff with ΔCp\n  const T0 = 300;\n  const dH_T = dH + dCp * (T - T0);\n  const dS_T = dS + dCp * Math.log(T / T0);\n  const dG = dH_T - T * dS_T;\n\n  STATE.deltaG = dG;\n  STATE.deltaH = dH_T;\n  STATE.minusTdS = -T * dS_T;\n  STATE.kd = Math.exp(dG / (R * T)) * 1e-9; // nM base\n\n  // Binding probability from Boltzmann\n  STATE.bindingPct = 1 / (1 + Math.exp(dG / (R * T) + 5)); // sigmoidal\n\n  // Configurational entropy\n  STATE.sConfig = Math.max(0, 6.5 - 0.005 * (T - 300) + Math.sin(STATE.time * 0.3) * 0.2);\n\n  // Audio entropy from analyser\n  if (STATE.audioData) {\n    let sum = 0, hist = new Float32Array(16);\n    for (let i = 0; i < STATE.audioData.length; i++) {\n      const bin = Math.floor(STATE.audioData[i] / 16);\n      hist[Math.min(bin, 15)]++;\n    }\n    const total = STATE.audioData.length;\n    for (let i = 0; i < 16; i++) {\n      const p = hist[i] / total;\n      if (p > 0) sum -= p * Math.log2(p);\n    }\n    STATE.sAudio = sum;\n  } else {\n    STATE.sAudio = 3.0 + Math.sin(STATE.time * 0.7) * 0.5 + (STATE.bpm - 120) / 60;\n  }\n\n  // Mutual information I(music; mol) — higher when audio entropy matches config entropy\n  STATE.mutualInfo = Math.max(0, Math.min(STATE.sAudio, STATE.sConfig) -\n    Math.abs(STATE.sAudio - STATE.sConfig) * 0.3);\n\n  // dI/dT — rate of mutual info change with temperature\n  STATE.diDt = -STATE.deltaBpm * 0.01; // direct mapping: ∆BPM → dI/dT\n\n  // Shannon Collapse Index\n  STATE.sci = Math.max(0, Math.min(1, 1 - STATE.sAudio / 4.5));\n\n  // Crooks forward/reverse work\n  const workIncrement = Math.abs(STATE.deltaBpm) * 0.001 * STATE.crooksDirection;\n  if (STATE.crooksDirection > 0) {\n    STATE.totalWorkFwd += Math.abs(workIncrement);\n  } else {\n    STATE.totalWorkRev += Math.abs(workIncrement);\n  }\n\n  // Irreversible entropy production: σ_irr = ⟨W_fwd⟩ + ⟨W_rev⟩ - 2ΔG\n  const sigma = Math.abs(STATE.totalWorkFwd + STATE.totalWorkRev - 2 * Math.abs(dG) * 0.01);\n  STATE.sigmaIrr = sigma;\n  STATE.landauerBits = sigma / (1.38e-23 * Math.log(2)) * 1e20; // scaled for display\n  STATE.landauerBits = Math.min(sigma / 0.693, 2.0); // practical: σ / ln2\n\n  // Crooks phase advancement\n  STATE.crooksPhase += 0.002 * (1 + Math.abs(STATE.deltaBpm) * 0.1);\n  if (STATE.crooksPhase > 1) {\n    STATE.crooksPhase = 0;\n    STATE.crooksDirection *= -1;\n  }\n}\n\n// --- THREE.JS SCENE ---\nlet scene, camera, renderer, clock;\nlet receptorMesh, ligandGroup, particleSystem;\nlet bindingSiteSphere, energyField;\nlet receptorAtoms = [], ligandAtoms = [];\n\nfunction initThreeJS() {\n  const canvas = document.getElementById('canvas3d');\n  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\n  renderer.setSize(window.innerWidth, window.innerHeight);\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n  renderer.toneMapping = THREE.ACESFilmicToneMapping;\n  renderer.toneMappingExposure = 1.2;\n\n  scene = new THREE.Scene();\n  scene.fog = new THREE.FogExp2(0x0a0e14, 0.015);\n\n  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);\n  camera.position.set(0, 2, 12);\n  camera.lookAt(0, 0, 0);\n\n  clock = new THREE.Clock();\n\n  // Lighting\n  const ambientLight = new THREE.AmbientLight(0x20808D, 0.3);\n  scene.add(ambientLight);\n\n  const mainLight = new THREE.PointLight(0x20808D, 2, 50);\n  mainLight.position.set(5, 8, 5);\n  scene.add(mainLight);\n\n  const accentLight = new THREE.PointLight(0xA84B2F, 1.5, 40);\n  accentLight.position.set(-5, -3, 5);\n  scene.add(accentLight);\n\n  const goldLight = new THREE.PointLight(0xD4A843, 1, 30);\n  goldLight.position.set(0, 5, -5);\n  scene.add(goldLight);\n\n  // --- RECEPTOR (binding pocket) ---\n  buildReceptor();\n\n  // --- LIGAND ---\n  buildLigand();\n\n  // --- PARTICLE FIELD ---\n  buildParticles();\n\n  // --- ENERGY FIELD (grid) ---\n  buildEnergyGrid();\n\n  // Resize handler\n  window.addEventListener('resize', () => {\n    camera.aspect = window.innerWidth / window.innerHeight;\n    camera.updateProjectionMatrix();\n    renderer.setSize(window.innerWidth, window.innerHeight);\n  });\n}\n\nfunction buildReceptor() {\n  // Receptor as a cluster of translucent spheres forming a pocket\n  const receptorGroup = new THREE.Group();\n\n  const pocketPositions = [\n    [-2, -1, 0], [-1.5, 0.5, -1], [-2.5, 0, 1], [-1, -1.5, -0.5],\n    [-2, 1, 0.5], [-3, -0.5, 0], [-1.5, -0.5, 1.5], [-2.5, 1, -0.5],\n    [-1, 0, -1.5], [-3, 0.5, -1], [-2, -1.5, 1], [-1.5, 1.5, 0],\n    [-3, -1, -0.5], [-2.5, -1, 1.5], [-1, 1, 1], [-2, 0, -2],\n    [-3.5, 0, 0], [-1, -0.5, 2], [-2.5, 1.5, 1], [-1.5, -2, 0],\n  ];\n\n  const atomColors = [0x20808D, 0x2a9aa8, 0x186a75, 0x15707c, 0x1d8f9c];\n\n  pocketPositions.forEach((pos, i) => {\n    const radius = 0.3 + Math.random() * 0.4;\n    const geo = new THREE.SphereGeometry(radius, 16, 16);\n    const mat = new THREE.MeshPhysicalMaterial({\n      color: atomColors[i % atomColors.length],\n      transparent: true,\n      opacity: 0.35,\n      roughness: 0.3,\n      metalness: 0.1,\n      clearcoat: 0.5,\n      clearcoatRoughness: 0.3,\n    });\n    const mesh = new THREE.Mesh(geo, mat);\n    mesh.position.set(pos[0], pos[1], pos[2]);\n    mesh.userData = { basePos: [...pos], baseOpacity: 0.35, baseRadius: radius };\n    receptorGroup.add(mesh);\n    receptorAtoms.push(mesh);\n  });\n\n  // Binding site glow\n  const bsGeo = new THREE.SphereGeometry(1.2, 32, 32);\n  const bsMat = new THREE.MeshPhysicalMaterial({\n    color: 0xD4A843,\n    transparent: true,\n    opacity: 0.08,\n    roughness: 1,\n    metalness: 0,\n    emissive: 0xD4A843,\n    emissiveIntensity: 0.3,\n  });\n  bindingSiteSphere = new THREE.Mesh(bsGeo, bsMat);\n  bindingSiteSphere.position.set(-2, 0, 0);\n  receptorGroup.add(bindingSiteSphere);\n\n  scene.add(receptorGroup);\n  receptorMesh = receptorGroup;\n}\n\nfunction buildLigand() {\n  ligandGroup = new THREE.Group();\n\n  // Ligand as a small molecule — aromatic ring + pharmacophore groups\n  const ligandPositions = [\n    [0, 0, 0], [0.6, 0.3, 0.2], [-0.3, 0.5, -0.2],\n    [0.2, -0.5, 0.3], [-0.4, -0.3, -0.4], [0.5, -0.2, -0.3],\n  ];\n\n  const ligandColors = [0xA84B2F, 0xc85a3a, 0xD4A843, 0xa03820, 0xb8652e, 0xD4A843];\n\n  ligandPositions.forEach((pos, i) => {\n    const r = 0.15 + Math.random() * 0.12;\n    const geo = new THREE.SphereGeometry(r, 12, 12);\n    const mat = new THREE.MeshPhysicalMaterial({\n      color: ligandColors[i],\n      roughness: 0.2,\n      metalness: 0.3,\n      clearcoat: 0.8,\n      emissive: ligandColors[i],\n      emissiveIntensity: 0.4,\n    });\n    const mesh = new THREE.Mesh(geo, mat);\n    mesh.position.set(pos[0], pos[1], pos[2]);\n    ligandGroup.add(mesh);\n    ligandAtoms.push(mesh);\n  });\n\n  // Bonds between ligand atoms\n  const bonds = [[0,1],[0,2],[0,3],[0,4],[1,5],[3,5]];\n  bonds.forEach(([a, b]) => {\n    const pa = new THREE.Vector3(...ligandPositions[a]);\n    const pb = new THREE.Vector3(...ligandPositions[b]);\n    const dir = new THREE.Vector3().subVectors(pb, pa);\n    const len = dir.length();\n    const geo = new THREE.CylinderGeometry(0.03, 0.03, len, 6);\n    const mat = new THREE.MeshBasicMaterial({ color: 0xA84B2F, transparent: true, opacity: 0.6 });\n    const bond = new THREE.Mesh(geo, mat);\n    bond.position.copy(pa).add(dir.multiplyScalar(0.5));\n    bond.lookAt(pb);\n    bond.rotateX(Math.PI / 2);\n    ligandGroup.add(bond);\n  });\n\n  ligandGroup.position.set(5, 0, 0); // Start far from receptor\n  scene.add(ligandGroup);\n}\n\nfunction buildParticles() {\n  const count = 3000;\n  const geo = new THREE.BufferGeometry();\n  const positions = new Float32Array(count * 3);\n  const colors = new Float32Array(count * 3);\n  const sizes = new Float32Array(count);\n\n  const teal = new THREE.Color(0x20808D);\n  const terra = new THREE.Color(0xA84B2F);\n  const gold = new THREE.Color(0xD4A843);\n  const palette = [teal, terra, gold];\n\n  for (let i = 0; i < count; i++) {\n    positions[i * 3] = (Math.random() - 0.5) * 30;\n    positions[i * 3 + 1] = (Math.random() - 0.5) * 20;\n    positions[i * 3 + 2] = (Math.random() - 0.5) * 30;\n\n    const c = palette[Math.floor(Math.random() * 3)];\n    colors[i * 3] = c.r;\n    colors[i * 3 + 1] = c.g;\n    colors[i * 3 + 2] = c.b;\n\n    sizes[i] = Math.random() * 3 + 0.5;\n  }\n\n  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));\n  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));\n  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));\n\n  const mat = new THREE.PointsMaterial({\n    size: 0.08,\n    vertexColors: true,\n    transparent: true,\n    opacity: 0.6,\n    blending: THREE.AdditiveBlending,\n    depthWrite: false,\n  });\n\n  particleSystem = new THREE.Points(geo, mat);\n  scene.add(particleSystem);\n}\n\nfunction buildEnergyGrid() {\n  const gridGeo = new THREE.PlaneGeometry(40, 40, 40, 40);\n  const gridMat = new THREE.MeshBasicMaterial({\n    color: 0x20808D,\n    wireframe: true,\n    transparent: true,\n    opacity: 0.04,\n  });\n  energyField = new THREE.Mesh(gridGeo, gridMat);\n  energyField.rotation.x = -Math.PI / 2;\n  energyField.position.y = -4;\n  scene.add(energyField);\n}\n\n// --- ANIMATION ---\nfunction animate() {\n  requestAnimationFrame(animate);\n\n  const dt = clock.getDelta();\n  STATE.time += dt;\n\n  // Update temperature from BPM\n  STATE.temperature = bpmToTemp(STATE.bpm);\n  updateThermo();\n\n  // Camera orbit\n  const camAngle = STATE.time * 0.08;\n  const camRadius = 12 + Math.sin(STATE.time * 0.2) * 2;\n  camera.position.x = Math.cos(camAngle) * camRadius;\n  camera.position.z = Math.sin(camAngle) * camRadius;\n  camera.position.y = 2 + Math.sin(STATE.time * 0.15) * 1.5;\n  camera.lookAt(0, 0, 0);\n\n  // --- LIGAND MOVEMENT ---\n  // Target position based on binding state\n  const bindTarget = STATE.crooksDirection > 0 ?\n    Math.max(0, STATE.ligandProgress - dt * 0.3 * (1 - STATE.bindingPct)) :\n    Math.min(1, STATE.ligandProgress + dt * 0.3 * STATE.bindingPct);\n\n  // Temperature modulates exploration vs commitment\n  const tempFactor = (STATE.temperature - 250) / 150; // 0 at cold, 1 at hot\n  const noise = Math.sin(STATE.time * 3) * tempFactor * 0.5;\n\n  STATE.ligandProgress += (bindTarget - STATE.ligandProgress) * dt * 2;\n  STATE.ligandProgress = Math.max(0, Math.min(1, STATE.ligandProgress + noise * dt));\n\n  // Map progress to position: 0 = far (5,0,0), 1 = docked (-2,0,0)\n  const lx = 5 - STATE.ligandProgress * 7;\n  const ly = Math.sin(STATE.time * 2) * (1 - STATE.ligandProgress) * 1.5;\n  const lz = Math.cos(STATE.time * 1.5) * (1 - STATE.ligandProgress) * 1.5;\n\n  ligandGroup.position.lerp(new THREE.Vector3(lx, ly, lz), dt * 3);\n\n  // Ligand rotation — faster when unbound\n  const rotSpeed = (1 - STATE.ligandProgress) * 2 + 0.2;\n  ligandGroup.rotation.x += dt * rotSpeed * 0.5;\n  ligandGroup.rotation.y += dt * rotSpeed;\n\n  // Ligand glow based on binding\n  ligandAtoms.forEach(atom => {\n    atom.material.emissiveIntensity = 0.2 + STATE.ligandProgress * 0.8;\n  });\n\n  // --- RECEPTOR BREATHING ---\n  receptorAtoms.forEach((atom, i) => {\n    const bp = atom.userData.basePos;\n    const breathe = 1 + Math.sin(STATE.time * 1.5 + i * 0.3) * tempFactor * 0.15;\n    atom.position.set(bp[0] * breathe, bp[1] * breathe, bp[2] * breathe);\n    atom.material.opacity = atom.userData.baseOpacity + STATE.ligandProgress * 0.15;\n\n    // Color shift based on temperature\n    const hue = 0.5 - tempFactor * 0.15; // teal → greenish when hot\n    atom.material.color.setHSL(hue, 0.6, 0.35);\n  });\n\n  // Binding site glow\n  bindingSiteSphere.material.opacity = 0.05 + STATE.ligandProgress * 0.15;\n  bindingSiteSphere.material.emissiveIntensity = 0.2 + STATE.ligandProgress * 0.8;\n  const bsScale = 1 + Math.sin(STATE.time * 2) * 0.1;\n  bindingSiteSphere.scale.set(bsScale, bsScale, bsScale);\n\n  // --- PARTICLES: Brownian motion scaled by temperature ---\n  const positions = particleSystem.geometry.attributes.position.array;\n  const particleSpeed = 0.02 * tempFactor + 0.005;\n  for (let i = 0; i < positions.length; i += 3) {\n    positions[i] += (Math.random() - 0.5) * particleSpeed;\n    positions[i + 1] += (Math.random() - 0.5) * particleSpeed;\n    positions[i + 2] += (Math.random() - 0.5) * particleSpeed;\n\n    // Wrap around\n    if (Math.abs(positions[i]) > 15) positions[i] *= -0.9;\n    if (Math.abs(positions[i + 1]) > 10) positions[i + 1] *= -0.9;\n    if (Math.abs(positions[i + 2]) > 15) positions[i + 2] *= -0.9;\n  }\n  particleSystem.geometry.attributes.position.needsUpdate = true;\n  particleSystem.material.opacity = 0.3 + tempFactor * 0.4;\n  particleSystem.material.size = 0.05 + tempFactor * 0.08;\n\n  // Energy grid deformation\n  const gridPositions = energyField.geometry.attributes.position.array;\n  for (let i = 0; i < gridPositions.length; i += 3) {\n    const x = gridPositions[i];\n    const z = gridPositions[i + 1]; // note: plane is rotated\n    gridPositions[i + 2] = Math.sin(x * 0.3 + STATE.time * 0.5) *\n      Math.cos(z * 0.3 + STATE.time * 0.3) * (1 + tempFactor);\n  }\n  energyField.geometry.attributes.position.needsUpdate = true;\n\n  // --- UPDATE HUD ---\n  updateHUD();\n\n  renderer.render(scene, camera);\n}\n\n// --- HUD UPDATE ---\nfunction updateHUD() {\n  const el = (id) => document.getElementById(id);\n\n  el('bpmValue').textContent = Math.round(STATE.bpm);\n  el('bpmValue').style.color = STATE.bpm > 140 ? '#A84B2F' : STATE.bpm < 80 ? '#D4A843' : '#20808D';\n\n  const dSign = STATE.deltaBpm >= 0 ? '+' : '';\n  el('deltaValue').textContent = dSign + STATE.deltaBpm.toFixed(1);\n  el('deltaValue').style.color = Math.abs(STATE.deltaBpm) > 5 ? '#A84B2F' :\n    Math.abs(STATE.deltaBpm) > 1 ? '#D4A843' : 'rgba(224,224,224,0.3)';\n\n  el('tempK').textContent = STATE.temperature.toFixed(1) + ' K';\n  el('deltaG').textContent = STATE.deltaG.toFixed(1) + ' kcal/mol';\n  el('deltaH').textContent = STATE.deltaH.toFixed(1) + ' kcal/mol';\n  el('minusTdS').textContent = (STATE.minusTdS >= 0 ? '+' : '') + STATE.minusTdS.toFixed(1) + ' kcal/mol';\n  el('kdVal').textContent = STATE.kd > 1e-6 ? (STATE.kd * 1e6).toFixed(1) + ' mM' :\n    STATE.kd > 1e-9 ? (STATE.kd * 1e9).toFixed(1) + ' nM' :\n    (STATE.kd * 1e12).toFixed(1) + ' pM';\n\n  el('sigmaIrr').textContent = STATE.sigmaIrr.toFixed(3) + ' k_B';\n  el('sigmaFill').style.width = Math.min(100, STATE.sigmaIrr * 100) + '%';\n  el('sigmaFill').style.background = STATE.sigmaIrr < 0.01 ? '#D4A843' :\n    STATE.sigmaIrr < 0.1 ? '#20808D' : '#A84B2F';\n\n  el('landauerBits').textContent = STATE.landauerBits.toFixed(3);\n\n  el('sAudio').textContent = STATE.sAudio.toFixed(2) + ' bits';\n  el('sConfig').textContent = STATE.sConfig.toFixed(2) + ' bits';\n  el('mutualInfo').textContent = STATE.mutualInfo.toFixed(2) + ' bits';\n  el('diDt').textContent = STATE.diDt.toFixed(3) + ' bits/K';\n  el('sciVal').textContent = STATE.sci.toFixed(2);\n  el('sciFill').style.width = STATE.sci * 100 + '%';\n  el('bindPct').textContent = (STATE.bindingPct * 100).toFixed(0) + '%';\n\n  el('crooksCycle').textContent = STATE.crooksDirection > 0 ? 'FWD →' : '← REV';\n  el('crooksCycle').style.color = STATE.crooksDirection > 0 ? '#20808D' : '#A84B2F';\n\n  // State badge\n  const badge = el('stateBadge');\n  if (STATE.sigmaIrr < 0.01) {\n    badge.textContent = 'THERMODYNAMIC CLOSURE';\n    badge.style.background = 'rgba(212, 168, 67, 0.2)';\n    badge.style.borderColor = 'rgba(212, 168, 67, 0.5)';\n    badge.style.color = '#D4A843';\n  } else if (STATE.ligandProgress > 0.85) {\n    badge.textContent = 'DOCKED — σ_irr = ' + STATE.sigmaIrr.toFixed(3);\n    badge.style.background = 'rgba(32, 128, 141, 0.2)';\n    badge.style.borderColor = 'rgba(32, 128, 141, 0.5)';\n    badge.style.color = '#20808D';\n  } else if (STATE.ligandProgress < 0.3) {\n    badge.textContent = 'EXPLORING';\n    badge.style.background = 'rgba(168, 75, 47, 0.15)';\n    badge.style.borderColor = 'rgba(168, 75, 47, 0.3)';\n    badge.style.color = '#A84B2F';\n  } else {\n    badge.textContent = STATE.crooksDirection > 0 ? 'BINDING...' : 'UNBINDING...';\n    badge.style.background = 'rgba(224, 224, 224, 0.05)';\n    badge.style.borderColor = 'rgba(224, 224, 224, 0.1)';\n    badge.style.color = 'rgba(224, 224, 224, 0.6)';\n  }\n\n  // Crooks cycle dots\n  const dotIdx = Math.floor(STATE.crooksPhase * 6);\n  for (let i = 1; i <= 6; i++) {\n    const dot = el('dot' + i);\n    if (i - 1 === dotIdx) {\n      dot.style.background = STATE.crooksDirection > 0 ? '#20808D' : '#A84B2F';\n      dot.style.width = '10px';\n      dot.style.height = '10px';\n    } else {\n      dot.style.background = 'rgba(224,224,224,0.1)';\n      dot.style.width = '8px';\n      dot.style.height = '8px';\n    }\n  }\n}\n\n// --- WAVEFORM VISUALIZATION ---\nfunction drawWaveform() {\n  requestAnimationFrame(drawWaveform);\n  const canvas = document.getElementById('waveform');\n  const ctx = canvas.getContext('2d');\n  ctx.clearRect(0, 0, 600, 60);\n\n  if (STATE.audioData) {\n    ctx.beginPath();\n    const sliceWidth = 600 / STATE.audioData.length;\n    let x = 0;\n    for (let i = 0; i < STATE.audioData.length; i++) {\n      const v = STATE.audioData[i] / 128.0;\n      const y = v * 30;\n      if (i === 0) ctx.moveTo(x, y);\n      else ctx.lineTo(x, y);\n      x += sliceWidth;\n    }\n    ctx.strokeStyle = STATE.crooksDirection > 0 ? 'rgba(32, 128, 141, 0.6)' : 'rgba(168, 75, 47, 0.6)';\n    ctx.lineWidth = 1.5;\n    ctx.stroke();\n  } else {\n    // Simulated waveform from BPM\n    ctx.beginPath();\n    for (let x = 0; x < 600; x++) {\n      const freq = STATE.bpm / 60;\n      const t = STATE.time + x * 0.01;\n      const y = 30 + Math.sin(t * freq * Math.PI * 2) * 20 *\n        (0.5 + 0.5 * Math.sin(t * 0.5)) *\n        (1 + Math.sin(t * freq * 4) * 0.3);\n      if (x === 0) ctx.moveTo(x, y);\n      else ctx.lineTo(x, y);\n    }\n    ctx.strokeStyle = 'rgba(32, 128, 141, 0.4)';\n    ctx.lineWidth = 1;\n    ctx.stroke();\n\n    // Beat markers\n    const beatInterval = 600 / (STATE.bpm / 30); // pixels per beat\n    ctx.strokeStyle = 'rgba(212, 168, 67, 0.2)';\n    ctx.lineWidth = 1;\n    for (let bx = (STATE.time * 50 % beatInterval); bx < 600; bx += beatInterval) {\n      ctx.beginPath();\n      ctx.moveTo(bx, 0);\n      ctx.lineTo(bx, 60);\n      ctx.stroke();\n    }\n  }\n}\n\n// --- AUDIO ANALYSIS ---\nlet audioContext, analyser, dataArray;\n\nasync function initAudio() {\n  try {\n    audioContext = new (window.AudioContext || window.webkitAudioContext)();\n    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n    const source = audioContext.createMediaStreamSource(stream);\n    analyser = audioContext.createAnalyser();\n    analyser.fftSize = 2048;\n    source.connect(analyser);\n    dataArray = new Uint8Array(analyser.frequencyBinCount);\n\n    // BPM detection loop\n    setInterval(() => {\n      analyser.getByteTimeDomainData(dataArray);\n      STATE.audioData = dataArray;\n      detectBPM(dataArray);\n    }, 100);\n\n    document.getElementById('trackName').textContent = 'Listening via microphone...';\n    document.getElementById('trackArtist').textContent = 'Play music — audio will be analyzed';\n  } catch (e) {\n    console.log('No mic access, using simulated audio');\n    // Fall back to simulated BPM\n    simulateBPM();\n  }\n}\n\nfunction detectBPM(data) {\n  // Simple onset detection via energy peaks\n  let energy = 0;\n  for (let i = 0; i < data.length; i++) {\n    const v = (data[i] - 128) / 128;\n    energy += v * v;\n  }\n  energy /= data.length;\n\n  // Use energy spikes for rough BPM\n  if (!detectBPM._history) {\n    detectBPM._history = [];\n    detectBPM._peaks = [];\n    detectBPM._lastPeak = 0;\n  }\n\n  detectBPM._history.push(energy);\n  if (detectBPM._history.length > 100) detectBPM._history.shift();\n\n  const avg = detectBPM._history.reduce((a, b) => a + b, 0) / detectBPM._history.length;\n\n  if (energy > avg * 1.5 && Date.now() - detectBPM._lastPeak > 200) {\n    detectBPM._peaks.push(Date.now());\n    detectBPM._lastPeak = Date.now();\n\n    if (detectBPM._peaks.length > 8) detectBPM._peaks.shift();\n\n    if (detectBPM._peaks.length >= 3) {\n      let intervals = [];\n      for (let i = 1; i < detectBPM._peaks.length; i++) {\n        intervals.push(detectBPM._peaks[i] - detectBPM._peaks[i - 1]);\n      }\n      const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;\n      const detectedBpm = Math.round(60000 / avgInterval);\n\n      if (detectedBpm > 40 && detectedBpm < 220 && !STATE.isManual) {\n        STATE.prevBpm = STATE.bpm;\n        STATE.bpm = STATE.bpm * 0.7 + detectedBpm * 0.3; // smooth\n        STATE.deltaBpm = STATE.bpm - STATE.prevBpm;\n      }\n    }\n  }\n}\n\nfunction simulateBPM() {\n  // Simulate a DJ set: gradual builds, drops, transitions\n  let phase = 0;\n  let targetBpm = 120;\n\n  setInterval(() => {\n    if (STATE.isManual) return;\n\n    phase += 0.01;\n\n    // Occasional tempo shifts\n    if (Math.random() < 0.005) {\n      targetBpm = 70 + Math.random() * 100; // 70-170 BPM\n    }\n\n    // Gradual approach\n    STATE.prevBpm = STATE.bpm;\n    STATE.bpm += (targetBpm - STATE.bpm) * 0.02;\n    STATE.bpm += Math.sin(phase * 3) * 0.5; // micro-fluctuations\n\n    STATE.deltaBpm = STATE.bpm - STATE.prevBpm;\n  }, 100);\n}\n\n// --- CONTROLS ---\nfunction initControls() {\n  const btnAuto = document.getElementById('btnAuto');\n  const btnManual = document.getElementById('btnManual');\n  const slider = document.getElementById('bpmSlider');\n  const btnCrooks = document.getElementById('btnCrooks');\n  const btnReset = document.getElementById('btnReset');\n\n  btnAuto.addEventListener('click', () => {\n    STATE.isManual = false;\n    btnAuto.classList.add('active');\n    btnManual.classList.remove('active');\n    slider.style.display = 'none';\n  });\n\n  btnManual.addEventListener('click', () => {\n    STATE.isManual = true;\n    btnManual.classList.add('active');\n    btnAuto.classList.remove('active');\n    slider.style.display = 'block';\n  });\n\n  slider.addEventListener('input', (e) => {\n    STATE.prevBpm = STATE.bpm;\n    STATE.bpm = parseFloat(e.target.value);\n    STATE.deltaBpm = STATE.bpm - STATE.prevBpm;\n  });\n\n  btnCrooks.addEventListener('click', () => {\n    STATE.crooksDirection *= -1;\n    STATE.crooksPhase = 0;\n    btnCrooks.textContent = STATE.crooksDirection > 0 ? 'CROOKS FLIP →' : '← CROOKS FLIP';\n  });\n\n  btnReset.addEventListener('click', () => {\n    STATE.totalWorkFwd = 0;\n    STATE.totalWorkRev = 0;\n    STATE.sigmaIrr = 0;\n    STATE.landauerBits = 0;\n  });\n\n  // Keyboard\n  window.addEventListener('keydown', (e) => {\n    if (e.key === 'ArrowUp') {\n      STATE.prevBpm = STATE.bpm;\n      STATE.bpm = Math.min(200, STATE.bpm + 5);\n      STATE.deltaBpm = 5;\n    } else if (e.key === 'ArrowDown') {\n      STATE.prevBpm = STATE.bpm;\n      STATE.bpm = Math.max(40, STATE.bpm - 5);\n      STATE.deltaBpm = -5;\n    } else if (e.key === ' ') {\n      e.preventDefault();\n      STATE.crooksDirection *= -1;\n      STATE.crooksPhase = 0;\n    }\n  });\n}\n\n// --- APPLE MUSIC POLLING (via parent context) ---\n// In the full NATURaL app, this would be MusicKit.js or native Swift bridge\n// Here we expose a global for external control\nwindow.setTrackInfo = function(name, artist, bpm) {\n  document.getElementById('trackName').textContent = name;\n  document.getElementById('trackArtist').textContent = artist;\n  if (bpm && !STATE.isManual) {\n    STATE.prevBpm = STATE.bpm;\n    STATE.bpm = bpm;\n    STATE.deltaBpm = STATE.bpm - STATE.prevBpm;\n  }\n};\n\n// --- INIT ---\ndocument.getElementById('instructions').addEventListener('click', async () => {\n  document.getElementById('instructions').style.display = 'none';\n  document.getElementById('hud').style.display = 'block';\n\n  initThreeJS();\n  await initAudio();\n  initControls();\n  animate();\n  drawWaveform();\n});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
