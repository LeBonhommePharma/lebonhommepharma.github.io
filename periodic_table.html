      <div className="text-[8px] leading-none opacity-75 text-left font-mono">{el.n}</div>
      <div className="text-[15px] sm:text-base font-bold text-center leading-none">{el.s}</div>
      <div className="text-[7px] leading-none text-center opacity-80 truncate">{el.N}</div>
    </button>
  );
}

function PlaceholderCell({ row, col, label, accentBg, accentText }) {
  return (
    <div
      style={{ gridRow: row, gridColumn: col }}
      className={`flex items-center justify-center rounded-md border-2 border-dashed ${accentBg} ${accentText} text-[10px] font-mono font-bold`}
    >
      {label}
    </div>
  );
}

function CategoryChip({ catKey, active, count, onClick }) {
  const cat = CATEGORIES[catKey];
  return (
    <button
      onClick={() => onClick(catKey)}
      className={`
        flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium
        transition-all duration-150 border
        ${active
          ? `${cat.bg} ${cat.text} border-white/40 shadow-md scale-105`
          : 'bg-zinc-800 text-zinc-300 border-zinc-700 hover:bg-zinc-700 hover:border-zinc-600'}
      `}
    >
      <span className="w-2 h-2 rounded-sm" style={{ backgroundColor: cat.hex }} />
      <span>{cat.label}</span>
      <span className={`text-[10px] opacity-70 ${active ? '' : 'text-zinc-500'}`}>{count}</span>
    </button>
  );
}

function PropRow({ icon: Icon, label, value, mono }) {
  return (
    <div className="flex items-baseline justify-between gap-3 py-1.5 border-b border-zinc-800 last:border-b-0">
      <span className="flex items-center gap-1.5 text-xs text-zinc-400 uppercase tracking-wide">
        {Icon && <Icon className="w-3 h-3" />}
        {label}
      </span>
      <span className={`text-sm text-zinc-100 text-right ${mono ? 'font-mono' : ''}`}>{value ?? '—'}</span>
    </div>
  );
}

function DetailPanel({ el, onClose }) {
  if (!el) {
    return (
      <div className="mt-6 rounded-xl border border-zinc-800 bg-zinc-900/50 p-6 text-center">
        <Atom className="w-8 h-8 text-zinc-600 mx-auto mb-2" />
        <p className="text-sm text-zinc-500">
          Click any element to inspect it. Pharmacological / biological notes appear when relevant.
        </p>
      </div>
    );
  }

  const cat = CATEGORIES[el.c];
  const pharma = PHARMA[el.n];
  const stateColor = el.st === 'gas' ? 'text-sky-400' : el.st === 'liquid' ? 'text-cyan-400' : el.st === 'synthetic' ? 'text-fuchsia-400' : 'text-amber-300';

  return (
    <div className="mt-6 rounded-xl border border-zinc-800 bg-zinc-900/70 overflow-hidden">
      <div className="grid grid-cols-1 md:grid-cols-[280px_1fr]">
        <div className={`relative ${cat.bg} ${cat.text} p-6 flex flex-col items-center justify-center`}>
          <button
            onClick={onClose}
            className="absolute top-2 right-2 p-1 rounded-md bg-black/20 hover:bg-black/40 text-white/90"
            aria-label="Close"
          >
            <X className="w-4 h-4" />
          </button>
          <div className="text-xs font-mono opacity-80 self-start absolute top-3 left-3">{el.n}</div>
          <div className="text-7xl font-bold leading-none">{el.s}</div>
          <div className="text-lg font-semibold mt-2">{el.N}</div>
          <div className="text-xs opacity-80 mt-1">{el.m} u</div>
          <div className="mt-3 px-2 py-0.5 rounded-full bg-black/25 text-[11px] font-medium uppercase tracking-wide">
            {cat.label}
          </div>
        </div>

        <div className="p-5">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6">
            <div>
              <PropRow icon={Layers}      label="Block"             value={el.ec.includes('p') ? 'p' : el.ec.includes('d') ? 'd' : el.ec.includes('f') ? 'f' : 's'} mono />
              <PropRow icon={Atom}        label="Electron config"   value={el.ec} mono />
              <PropRow icon={Zap}         label="Electronegativity" value={el.en !== null ? `${el.en} (Pauling)` : 'n/a'} mono />
              <PropRow icon={null}        label="State (RT)"        value={<span className={stateColor}>{el.st}</span>} />
            </div>
            <div>
              <PropRow icon={Thermometer} label="Melting point"  value={el.mp ? `${el.mp} K  (${(el.mp - 273.15).toFixed(1)} °C)` : 'unknown'} mono />
              <PropRow icon={Thermometer} label="Boiling point"  value={el.bp ? `${el.bp} K  (${(el.bp - 273.15).toFixed(1)} °C)` : 'unknown'} mono />
              <PropRow icon={null}        label="Period / Group" value={`${Math.min(el.r, el.r === 9 ? 6 : el.r === 10 ? 7 : el.r)} / ${el.c === 'lanthanide' || el.c === 'actinide' ? 'f-block' : el.co}`} mono />
              <PropRow icon={Calendar}    label="Discovered"     value={el.y ? el.y : 'antiquity'} />
            </div>
          </div>

          {pharma && (
            <div className="mt-4 rounded-lg border border-fuchsia-500/30 bg-fuchsia-500/5 p-3">
              <div className="flex items-center gap-2 text-xs font-semibold text-fuchsia-300 uppercase tracking-wider mb-1.5">
                <Pill className="w-3.5 h-3.5" />
                Pharmacology / Biology
              </div>
              <p className="text-sm text-zinc-200 leading-relaxed">{pharma}</p>
            </div>
          )}

          {!pharma && (
            <div className="mt-4 text-xs text-zinc-500 italic">
              No notable direct pharmacological / biological role recorded for this element.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// =====================================================================
// MAIN
// =====================================================================
function PeriodicTable() {
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState(null);
  const [search, setSearch] = useState('');
  const [hovered, setHovered] = useState(null);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') { setSelected(null); setFilter(null); setSearch(''); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const counts = useMemo(() => {
    const c = {};
    ELEMENTS.forEach(el => { c[el.c] = (c[el.c] || 0) + 1; });
    return c;
  }, []);

  const matchesSearch = (el) => {
    if (!search.trim()) return true;
    const q = search.trim().toLowerCase();
    return el.s.toLowerCase().includes(q)
        || el.N.toLowerCase().includes(q)
        || String(el.n) === q
        || String(el.n).startsWith(q);
  };
  const matchesFilter = (el) => !filter || el.c === filter;
  const isMatching = (el) => matchesSearch(el) && matchesFilter(el);
  const hasActiveFilter = !!filter || !!search.trim();
  const matchingCount = ELEMENTS.filter(isMatching).length;

  const handleSelect = (el) => {
    setSelected((prev) => (prev?.n === el.n ? null : el));
  };

  return (
    <div className="min-h-screen bg-zinc-950 text-zinc-100">
      <div className="max-w-[1280px] mx-auto p-3 sm:p-6">
        <header className="mb-5">
          <div className="flex items-baseline gap-3 flex-wrap">
            <h1 className="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-50">
              Periodic Table
            </h1>
            <span className="text-xs sm:text-sm text-zinc-500 font-mono">
              118 elements · IUPAC 2024 standard masses
            </span>
          </div>
          <p className="text-sm text-zinc-400 mt-1.5 max-w-3xl">
            Every drug, every cell, every star is built from this set. Click an element for details — pharmacological notes show up where the element meets medicine.
          </p>
        </header>

        <div className="mb-4 flex flex-col gap-3">
          <div className="relative max-w-sm">
            <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" />
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search: name, symbol, or atomic #"
              className="w-full bg-zinc-900 border border-zinc-800 rounded-lg pl-9 pr-9 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600"
            />
            {search && (
              <button
                onClick={() => setSearch('')}
                className="absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded-md text-zinc-500 hover:text-zinc-200 hover:bg-zinc-800"
                aria-label="Clear search"
              >
                <X className="w-3.5 h-3.5" />
              </button>
            )}
          </div>

          <div className="flex flex-wrap gap-1.5">
            {Object.keys(CATEGORIES).map((k) => (
              <CategoryChip
                key={k}
                catKey={k}
                active={filter === k}
                count={counts[k] || 0}
                onClick={(key) => setFilter(filter === key ? null : key)}
              />
            ))}
            {hasActiveFilter && (
              <button
                onClick={() => { setFilter(null); setSearch(''); }}
                className="px-2.5 py-1 rounded-full text-xs font-medium bg-zinc-800 text-zinc-400 border border-zinc-700 hover:bg-zinc-700 hover:text-zinc-100 flex items-center gap-1.5"
              >
                <X className="w-3 h-3" />
                Clear ({matchingCount} match{matchingCount === 1 ? '' : 'es'})
              </button>
            )}
          </div>
        </div>

        <div className="overflow-x-auto pb-2">
          <div
            className="grid gap-1 mx-auto"
            style={{
              gridTemplateColumns: 'repeat(18, minmax(46px, 1fr))',
              gridTemplateRows: 'repeat(7, 56px) 14px repeat(2, 56px)',
              minWidth: 880,
              maxWidth: 1200,
            }}
            onMouseLeave={() => setHovered(null)}
          >
            {ELEMENTS.map((el) => {
              const matching = isMatching(el);
              const dimmed = hasActiveFilter && !matching;
              const selectedHere = selected?.n === el.n;
              const sameGroup = hovered && (hovered.co === el.co && hovered.r <= 7 && el.r <= 7);
              const samePeriod = hovered && (hovered.r === el.r);
              const isHighlighted = (sameGroup || samePeriod) && !selectedHere;
              return (
                <ElementCell
                  key={el.n}
                  el={el}
                  dimmed={dimmed}
                  selected={selectedHere}
                  isHighlighted={isHighlighted}
                  onClick={handleSelect}
                  onHover={setHovered}
                  onLeave={() => setHovered(null)}
                />
              );
            })}
            <PlaceholderCell row={6} col={3} label="57–71"  accentBg="bg-pink-500/10 border-pink-500/40"  accentText="text-pink-300" />
            <PlaceholderCell row={7} col={3} label="89–103" accentBg="bg-rose-500/10 border-rose-500/40"  accentText="text-rose-300" />
          </div>
        </div>

        <DetailPanel el={selected} onClose={() => setSelected(null)} />

        <div className="mt-6 flex flex-wrap items-center justify-between gap-2 text-xs text-zinc-500">
          <div>
            Hover an element to highlight its group + period. Press <kbd className="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-700 font-mono text-[10px]">Esc</kbd> to clear all.
          </div>
          <div className="font-mono">
            {selected ? `selected: ${selected.s} (${selected.n})` : `${ELEMENTS.length} elements loaded`}
          </div>
        </div>

        <div className="mt-8 pt-4 border-t border-zinc-800 flex items-center justify-between flex-wrap gap-2">
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '11px', color: 'rgba(138,147,168,0.5)' }}>
            Le Bonhomme Pharma · Montréal · Open Science
          </span>
          <a href="entropy_docking.html" style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: '11px', color: '#22D3EE', textDecoration: 'none' }}>
            Entropy Docking →
          </a>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PeriodicTable />);
</script>
</body>
</html>
